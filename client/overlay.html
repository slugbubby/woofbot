<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>woofbot overlay</title>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
        color: white;
        font-family: sans-serif;
      }
      #debugLogTitle {
        display: none;
      }
      #debugLog {
        display: none;
        font-size: 24px;
        max-width: 300px;
      }
    </style>
  </head>

  <body>
    <h1 id="debugLogTitle">DEBUG LOG</h1>
    <div id="debugLog"></div>

    <script>
      const isDebug = new URLSearchParams(location.search).has("debug");
      const debugLog = document.getElementById("debugLog");
      if (isDebug) {
        debugLog.style.display = "block";
        document.getElementById("debugLogTitle").style.display = "block";
      }

      function debugNote(msg) {
        if (!isDebug) {
          return;
        }
        const line = document.createElement("div");
        line.textContent = `${new Date().toLocaleTimeString()} ${msg}`;
        debugLog.prepend(line);
      }

      const events = new EventSource("/overlay/events");
      events.addEventListener("open", () => debugNote("Connected"));
      events.addEventListener("error", () => {
        debugNote("Disconnected, retrying…");
      });

      events.addEventListener("woof", (e) => {
        const { user, sound } = JSON.parse(e.data);
        debugNote(`${user} woof`);
        new Audio(`/sounds/${encodeURIComponent(sound)}.mp3`)
          .play()
          .catch((err) => debugNote(`Woof failed: ${err.message}`));
      });
    </script>
  </body>
</html>
